[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sar-manager"
version = "0.2.4"
description = "Offline SAR metadata ingestion and spatial query service"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.116.1",
  "psycopg[binary,pool]==3.2.9",
  "pydantic-settings==2.10.1",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==8.4.1",
  "ruff==0.12.5",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
